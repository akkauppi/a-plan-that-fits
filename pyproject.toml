[project]
name = "geospatial-constraint-lab"
version = "0.1.0"
description = "Reproducible geospatial constraint-solving experiments"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.4,<4.8",
  "fastapi>=0.115,<0.120",
  "networkx>=3.3,<4",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "z3-solver>=4.13,<5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]
exclude = ["apps*", "data*", "docs*", "scripts*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.28",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
data = [
  "geopandas>=1.0,<2",
  "osmnx>=2.0,<3",
  "pyproj>=3.7,<4",
  "shapely>=2.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["services/solver/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
